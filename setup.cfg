[metadata]
name = coding-agent
version = 0.1.0
description = A coding agent implemented from first principles
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    pydantic>=2.0,<3

[options.package_data]
coding_agent.prompts =
    *.md

[options.packages.find]
where = src

[options.extras_require]
openai =
    openai>=1.0
dev =
    pytest>=7.0
    ruff>=0.6
